<section id="personas">
    <h2>Elige una vida sana</h2>

    <div class="personas">

        <!-- 1. Persona haciendo deporte -->
        <div class="persona">
            <svg viewBox="0 0 100 140" class="p-deporte">
                <g class="figura">
                    <circle class="cabeza" cx="50" cy="20" r="12"/>
                    <line class="cuerpo" x1="50" y1="32" x2="50" y2="80"/>
                    <line class="brazo-i" x1="50" y1="42" x2="50" y2="72"/>
                    <line class="brazo-d" x1="50" y1="42" x2="50" y2="72"/>
                    <line class="pierna-i" x1="50" y1="80" x2="50" y2="120"/>
                    <line class="pierna-d" x1="50" y1="80" x2="50" y2="120"/>
                </g>
            </svg>
            <p>Haz deporte</p>
        </div>

        <!-- 2. Persona corriendo -->
        <div class="persona">
            <svg viewBox="0 0 100 140" class="p-correr">
                <g class="figura">
                    <circle class="cabeza" cx="50" cy="20" r="12"/>
                    <line class="cuerpo" x1="50" y1="32" x2="50" y2="80"/>
                    <line class="brazo-i" x1="50" y1="42" x2="50" y2="72"/>
                    <line class="brazo-d" x1="50" y1="42" x2="50" y2="72"/>
                    <line class="pierna-i" x1="50" y1="80" x2="50" y2="120"/>
                    <line class="pierna-d" x1="50" y1="80" x2="50" y2="120"/>
                </g>
            </svg>
            <p>Mantente activo</p>
        </div>

        <!-- 3. Persona diciendo NO -->
        <div class="persona">
            <svg viewBox="0 0 100 140" class="p-no">
                <g class="figura">
                    <circle class="cabeza" cx="50" cy="20" r="12"/>
                    <line class="cuerpo" x1="50" y1="32" x2="50" y2="80"/>
                    <line class="brazo-i" x1="50" y1="42" x2="50" y2="72"/>
                    <line class="brazo-d" x1="50" y1="42" x2="50" y2="72"/>
                    <line class="pierna-i" x1="50" y1="80" x2="50" y2="120"/>
                    <line class="pierna-d" x1="50" y1="80" x2="50" y2="120"/>
                </g>
            </svg>
            <p>Di <span class="texto-no">¡NO!</span> a las drogas</p>
        </div>

        <!-- 4. Amigos que se apoyan -->
        <div class="persona">
            <div class="amigos">
                <svg viewBox="0 0 100 140" class="p-amigo">
                    <g class="figura">
                        <circle class="cabeza" cx="50" cy="20" r="12"/>
                        <line class="cuerpo" x1="50" y1="32" x2="50" y2="80"/>
                        <line class="brazo-i" x1="50" y1="42" x2="50" y2="72"/>
                        <line class="brazo-d" x1="50" y1="42" x2="50" y2="72"/>
                        <line class="pierna-i" x1="50" y1="80" x2="50" y2="120"/>
                        <line class="pierna-d" x1="50" y1="80" x2="50" y2="120"/>
                    </g>
                </svg>

                <span class="corazon-flota">❤️</span>

                <svg viewBox="0 0 100 140" class="p-amigo p-retraso">
                    <g class="figura">
                        <circle class="cabeza" cx="50" cy="20" r="12"/>
                        <line class="cuerpo" x1="50" y1="32" x2="50" y2="80"/>
                        <line class="brazo-i" x1="50" y1="42" x2="50" y2="72"/>
                        <line class="brazo-d" x1="50" y1="42" x2="50" y2="72"/>
                        <line class="pierna-i" x1="50" y1="80" x2="50" y2="120"/>

                    </g>
                </svg>
            </div>
            <p>Apóyate en tus amigos</p>
